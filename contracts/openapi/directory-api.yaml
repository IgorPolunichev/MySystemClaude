        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/engineers:
    get:
      operationId: listEngineers
      tags:
      - engineers
      summary: Список инженеров
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Поиск по ФИО, логину
      - name: serviceDepartmentId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Отдел
      - name: active
        in: query
        required: false
        schema:
          type: boolean
        description: Активные / заблокированные
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: sort
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineerPage'
    post:
      operationId: createEngineer
      tags:
      - engineers
      summary: Создать инженера и его учётную запись в Keycloak
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineerCreate'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engineer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/engineers/me:
    get:
      operationId: getCurrentEngineer
      tags:
      - engineers
      summary: Карточка инженера текущего пользователя
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engineer'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/engineers/{id}:
    get:
      operationId: getEngineer
      tags:
      - engineers
      summary: Получить инженера
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engineer'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateEngineer
      tags:
      - engineers
      summary: Изменить инженера
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineerUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engineer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/equipment/{id}/meter:
    post:
      operationId: raiseEquipmentMeter
      tags:
      - equipment
      summary: Поднять текущую наработку по данным акта
      description: Доступно любому пользователю; значения только увеличиваются. Вызывается act-service при сохранении и закрытии акта.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterInput'
      responses:
        '204':
          description: Готово
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Номер страницы с 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Размер страницы
  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Не найдено
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'Конфликт: запись изменена другим пользователем, дубликат или запись используется'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Данные не прошли проверку
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
