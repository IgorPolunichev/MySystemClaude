openapi: 3.1.0
info:
  title: Сервисные акты — справочники (directory-service)
  version: 1.0.0
  description: 'Организации-заказчики, их подразделения, техника, типы техники, отделы сервисной компании и инженеры.

    Добавлять записи может любой пользователь; изменять и удалять — руководитель отдела и администратор; инженеров и отделы сервисной компании
    — только администратор.'
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/v1/organizations:
    get:
      operationId: listOrganizations
      tags:
      - organizations
      summary: 'Список: организация'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Поиск по названию, сокращённому названию, ИНН
      - name: active
        in: query
        required: false
        schema:
          type: boolean
        description: Только активные / только неактивные
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: sort
        in: query
        schema:
          type: string
        description: Поле сортировки; «-» в начале — по убыванию
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
    post:
      operationId: createOrganization
      tags:
      - organizations
      summary: 'Создать: организация'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/organizations/{id}:
    get:
      operationId: getOrganization
      tags:
      - organizations
      summary: 'Получить: организация'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateOrganization
      tags:
      - organizations
      summary: 'Изменить: организация'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: deleteOrganization
      tags:
      - organizations
      summary: 'Удалить: организация'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      responses:
        '204':
          description: Удалено
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/organizations/{id}/departments:
    get:
      operationId: listOrganizationDepartments
      tags:
      - departments
      summary: Подразделения организации (плоский список, дерево — по parentId)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organizations/import:
    post:
      operationId: importOrganizations
      tags:
      - organizations
      summary: 'Импорт из Excel/CSV: организации'
      description: Строки с ошибками пропускаются, остальные сохраняются. Существующие записи обновляются по ключу (см. шаблон).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/organizations/import/template:
    get:
      operationId: getOrganizationsImportTemplate
      tags:
      - organizations
      summary: 'Шаблон импорта: организации'
      responses:
        '200':
          description: Файл Excel
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /api/v1/departments:
    post:
      operationId: createDepartment
      tags:
      - departments
      summary: 'Создать: подразделение'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentInput'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/departments/{id}:
    put:
      operationId: updateDepartment
      tags:
      - departments
      summary: 'Изменить: подразделение'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: deleteDepartment
      tags:
      - departments
      summary: 'Удалить: подразделение'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      responses:
        '204':
          description: Удалено
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/equipment-types:
    get:
      operationId: listEquipmentTypes
      tags:
      - equipment-types
      summary: 'Список: тип техники'
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentType'
    post:
      operationId: createEquipmentType
      tags:
      - equipment-types
      summary: 'Создать: тип техники'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentTypeInput'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/equipment-types/{id}:
    put:
      operationId: updateEquipmentType
      tags:
      - equipment-types
      summary: 'Изменить: тип техники'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentTypeInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: deleteEquipmentType
      tags:
      - equipment-types
      summary: 'Удалить: тип техники'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      responses:
        '204':
          description: Удалено
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/equipment:
    get:
      operationId: listEquipment
      tags:
      - equipment
      summary: 'Список: единица техники'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Поиск по серийному, гаражному, госномеру, марке и модели
      - name: organizationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Организация
      - name: departmentId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Подразделение (включая вложенные)
      - name: equipmentTypeId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Тип техники
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: sort
        in: query
        schema:
          type: string
        description: Поле сортировки; «-» в начале — по убыванию
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentPage'
    post:
      operationId: createEquipment
      tags:
      - equipment
      summary: 'Создать: единица техники'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentInput'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/equipment/{id}:
    get:
      operationId: getEquipment
      tags:
      - equipment
      summary: 'Получить: единица техники'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateEquipment
      tags:
      - equipment
      summary: 'Изменить: единица техники'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: deleteEquipment
      tags:
      - equipment
      summary: 'Удалить: единица техники'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Идентификатор
      responses:
        '204':
          description: Удалено
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/equipment/import:
    post:
      operationId: importEquipment
      tags:
      - equipment
      summary: 'Импорт из Excel/CSV: техника'
      description: Строки с ошибками пропускаются, остальные сохраняются. Существующие записи обновляются по ключу (см. шаблон).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '403':
