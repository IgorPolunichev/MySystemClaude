        meterKm:
          type:
          - number
          - 'null'
        location:
          type:
          - string
          - 'null'
        workStartDate:
          type:
          - string
          - 'null'
          format: date
        workEndDate:
          type:
          - string
          - 'null'
          format: date
        periodOverridden:
          type: boolean
        calendarDays:
          type: integer
        workedDays:
          type: integer
        shortDescription:
          type:
          - string
          - 'null'
        detailedDescription:
          type:
          - string
          - 'null'
        recommendations:
          type:
          - string
          - 'null'
        customerRepName:
          type:
          - string
          - 'null'
        customerRepPosition:
          type:
          - string
          - 'null'
        hideRequisites:
          type: boolean
        hideTravelTime:
          type: boolean
        authorEngineerId:
          type: string
          format: uuid
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        closedAt:
          type:
          - string
          - 'null'
          format: date-time
        closedBy:
          type:
          - string
          - 'null'
        engineers:
          type: array
          items:
            $ref: '#/components/schemas/ActParticipant'
        timeEntries:
          type: array
          items:
            $ref: '#/components/schemas/ActTimeEntry'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ActPartLine'
        totalHours:
