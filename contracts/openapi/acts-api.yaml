          format: uuid
        name:
          type: string
        shortName:
          type:
          - string
          - 'null'
        inn:
          type:
          - string
          - 'null'
        kpp:
          type:
          - string
          - 'null'
        address:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
    ActSite:
