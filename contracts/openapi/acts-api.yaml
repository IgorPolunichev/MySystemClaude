        catalogItemId:
          type:
          - string
          - 'null'
          format: uuid
        name:
          type: string
        catalogNumber:
          type:
          - string
          - 'null'
        quantity:
          type: number
        unitCode:
          type: string
        unitName:
          type: string
        notes:
          type:
          - string
          - 'null'
    ActPermissions:
      type: object
      required:
      - canEdit
      - canEditAnyTime
      - canOpen
      - canClose
      - canReopen
      - canCancel
      - canDelete
      - requiresAdminComment
      - canAttach
      properties:
        canEdit:
          type: boolean
        canEditAnyTime:
          type: boolean
        canOpen:
          type: boolean
        canClose:
          type: boolean
        canReopen:
          type: boolean
        canCancel:
          type: boolean
        canDelete:
          type: boolean
        requiresAdminComment:
          type: boolean
        canAttach:
          type: boolean
    ActDetail:
      type: object
