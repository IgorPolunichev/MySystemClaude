        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/acts/{id}/reopen:
    post:
      operationId: reopenAct
      tags:
      - acts
      summary: Вернуть закрытый акт в работу (администратор)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
