    MeterType:
      type: string
      enum:
      - HOURS
      - KM
      - BOTH
    ParticipantRole:
      type: string
      enum:
      - LEAD
      - MEMBER
    PartSource:
      type: string
      enum:
      - CATALOG
      - MANUAL
      - WAREHOUSE
    ActSummary:
      type: object
      required:
      - id
      - status
      - totalHours
      - hasSignedScan
      properties:
        id:
          type: string
          format: uuid
        number:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/ActStatus'
        organizationName:
          type:
          - string
          - 'null'
        departmentName:
          type:
          - string
          - 'null'
        equipmentTitle:
          type:
          - string
          - 'null'
        equipmentNumbers:
          type:
          - string
          - 'null'
        shortDescription:
          type:
          - string
          - 'null'
        periodStart:
          type:
          - string
          - 'null'
          format: date
        periodEnd:
          type:
          - string
          - 'null'
          format: date
        totalHours:
          type: number
        engineerNames:
          type:
          - string
          - 'null'
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        hasSignedScan:
          type: boolean
        siteName:
          type:
          - string
          - 'null'
        highlight:
          type:
          - string
          - 'null'
          description: Фрагмент текста с совпадениями, выделенными [[ ]] (только при поиске)
    ActSummaryPage:
      type: object
      required:
      - items
