        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
  /api/v1/acts/{id}/cancel:
    post:
      operationId: cancelAct
      tags:
      - acts
      summary: Аннулировать
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
