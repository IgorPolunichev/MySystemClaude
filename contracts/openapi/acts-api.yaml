        executorId:
          type:
          - string
          - 'null'
          format: uuid
        siteId:
          type:
          - string
          - 'null'
          format: uuid
    CommentInput:
      type: object
      properties:
        comment:
          type:
          - string
          - 'null'
          maxLength: 1000
    AddEngineerInput:
      type: object
      required:
      - engineerId
      properties:
        engineerId:
          type: string
          format: uuid
    TimeEntryInput:
      type: object
      description: 'Ячейка табеля. Продуктивное время считает сервер: окончание − начало − перерывы. Окончание не позже начала — работа до следующего
        дня (ночная смена). Только время в пути — без интервала.'
      properties:
        startTime:
          type:
          - string
          - 'null'
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Время ЧЧ:ММ
          example: '10:00'
        endTime:
          type:
          - string
          - 'null'
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Время ЧЧ:ММ
          example: '10:00'
        breaks:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/WorkBreak'
        travelHours:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 24
          multipleOf: 0.25
        comment:
          type:
          - string
          - 'null'
          maxLength: 500
    TimeEntryResult:
      type: object
      required:
      - act
      properties:
        act:
          $ref: '#/components/schemas/ActDetail'
        warning:
          type:
          - string
          - 'null'
          description: Например, больше 12 ч за день
    PartLineInput:
      type: object
      required:
      - source
      - name
      - quantity
      - unitCode
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
        source:
          $ref: '#/components/schemas/PartSource'
        catalogItemId:
          type:
          - string
          - 'null'
          format: uuid
        name:
          type: string
          maxLength: 300
        catalogNumber:
          type:
          - string
          - 'null'
          maxLength: 100
        quantity:
          type: number
          exclusiveMinimum: 0
        unitCode:
          type: string
        notes:
          type:
          - string
          - 'null'
          maxLength: 500
        addToCatalog:
          type:
          - boolean
          - 'null'
          description: 'Для MANUAL: добавить позицию в каталог'
    HistoryEntry:
      type: object
      required:
      - action
      properties:
        at:
          type:
          - string
          - 'null'
          format: date-time
        user:
          type:
          - string
          - 'null'
        action:
          type: string
        details:
          type:
          - string
          - 'null'
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
          description: Ошибки по полям формы
    WorkBreak:
      type: object
