  /api/v1/acts/{id}/time/{engineerId}/{date}:
    put:
      operationId: putActTime
      tags:
      - act-content
      summary: Записать интервал работы инженера за день (часы считаются из интервала минус перерывы)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      - name: engineerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: deleteActTime
      tags:
      - act-content
      summary: Удалить часы инженера за день
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      - name: engineerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/acts/{id}/parts:
