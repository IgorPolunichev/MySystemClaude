      summary: Удалить фото из акта
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: photoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/acts/{id}/attachments:
    post:
      operationId: addActAttachment
      tags:
      - act-attachments
      summary: Прикрепить документ (файл загружен в media-service с ownerType ACT_ATTACHMENT)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAttachmentInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
