          items:
            $ref: '#/components/schemas/ActAttachment'
    ActCreate:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: UUID v7 клиента для идемпотентности
        equipmentId:
          type:
          - string
          - 'null'
          format: uuid
    ActHeaderInput:
      type: object
      required:
      - version
      properties:
        version:
          type: integer
          format: int64
        equipmentId:
          type:
          - string
          - 'null'
          format: uuid
        meterHours:
          type:
          - number
          - 'null'
          minimum: 0
        meterKm:
          type:
          - number
          - 'null'
          minimum: 0
        location:
          type:
          - string
          - 'null'
          maxLength: 300
        workStartDate:
          type:
          - string
          - 'null'
          format: date
          description: Ручная дата начала; по умолчанию — по табелю
        workEndDate:
          type:
          - string
          - 'null'
          format: date
        shortDescription:
          type:
          - string
          - 'null'
          maxLength: 100
        detailedDescription:
          type:
          - string
          - 'null'
          maxLength: 10000
        recommendations:
          type:
          - string
          - 'null'
          maxLength: 10000
        customerRepName:
          type:
          - string
          - 'null'
          maxLength: 200
        customerRepPosition:
          type:
          - string
          - 'null'
          maxLength: 200
        hideRequisites:
          type:
          - boolean
          - 'null'
        hideTravelTime:
          type:
          - boolean
          - 'null'
        adminComment:
          type:
          - string
          - 'null'
          maxLength: 1000
