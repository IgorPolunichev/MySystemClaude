      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type:
          - string
          - 'null'
        inn:
          type:
          - string
          - 'null'
        kpp:
          type:
          - string
          - 'null'
        legalAddress:
          type:
          - string
          - 'null'
        departmentId:
          type:
          - string
          - 'null'
          format: uuid
        departmentName:
          type:
          - string
          - 'null'
    ActEquipment:
      type:
      - object
      - 'null'
