      - role
      - totalHours
      - isCurrentUser
      properties:
        engineerId:
          type: string
          format: uuid
        fullName:
          type: string
        position:
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/ParticipantRole'
        totalHours:
          type: number
        isCurrentUser:
          type: boolean
    ActTimeEntry:
      type: object
      required:
      - id
      - engineerId
      - workDate
      - breaks
      - workMinutes
      - hours
      properties:
        id:
          type: string
          format: uuid
        engineerId:
          type: string
          format: uuid
        workDate:
          type: string
          format: date
        startTime:
          type:
          - string
          - 'null'
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Время ЧЧ:ММ
          example: '10:00'
        endTime:
          type:
          - string
          - 'null'
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Время ЧЧ:ММ
          example: '10:00'
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/WorkBreak'
        workMinutes:
          type: integer
          description: Продуктивные минуты (источник правды)
        hours:
          type: number
          description: Продуктивные часы, округлены до сотых
        travelHours:
          type:
          - number
          - 'null'
        comment:
          type:
          - string
          - 'null'
    ActPartLine:
      type: object
      required:
