      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
  /api/v1/acts/{id}/copy:
    post:
      operationId: copyAct
      tags:
      - acts
      summary: Создать новый черновик на основе акта
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/acts/{id}/history:
    get:
      operationId: getActHistory
      tags:
      - acts
      summary: Журнал изменений
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryEntry'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/acts/{id}/engineers:
    post:
      operationId: addActEngineer
      tags:
      - act-content
      summary: Добавить инженера в акт
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEngineerInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/acts/{id}/engineers/{engineerId}:
    delete:
      operationId: removeActEngineer
      tags:
      - act-content
      summary: Убрать инженера из акта
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      - name: engineerId
        in: path
        required: true
        schema:
          type: string
