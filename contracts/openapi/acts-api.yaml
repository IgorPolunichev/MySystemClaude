openapi: 3.1.0
info:
  title: Сервисные акты — акты выполненных работ (act-service)
  version: 1.0.0
  description: 'Жизненный цикл акта: черновик → открыт (номер АВР-ГГГГ-NNNNNN) → закрыт; аннулирование. Табель «инженер × день», запчасти, участники,
    журнал. Права текущего пользователя возвращаются в карточке (permissions).'
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/v1/acts:
    get:
      operationId: listActs
      tags:
      - acts
      summary: Реестр актов
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: 'Полнотекстовый поиск по всему акту (русская морфология, websearch-синтаксис: "точная фраза", -исключить, or) и по части
          номеров акта, техники и запчастей'
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ActStatus'
        style: form
        explode: true
      - name: organizationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Организация
      - name: equipmentId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Техника
      - name: engineerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Инженер-участник
      - name: siteId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Площадка
      - name: partNumber
        in: query
        required: false
        schema:
          type: string
        description: Часть каталожного номера запчасти
      - name: shortDescription
        in: query
        required: false
        schema:
          type: string
        description: Краткое описание — точное совпадение
      - name: signedScan
        in: query
        required: false
        schema:
          type: boolean
        description: Есть ли скан подписанного акта
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Период работ с
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Период работ по
      - name: mine
        in: query
        required: false
        schema:
          type: boolean
        description: Только акты, где я участвую
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: number, createdAt, periodStart, organizationName, equipmentTitle, shortDescription, engineerNames, totalHours, status; «-»
          — по убыванию. По умолчанию — по релевантности при поиске, иначе -createdAt
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActSummaryPage'
    post:
      operationId: createAct
      tags:
      - acts
      summary: Создать черновик; автор — ответственный инженер
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActCreate'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/acts/export:
    get:
      operationId: exportActs
      tags:
      - acts
      summary: Реестр актов в Excel (текущая выборка, до 5000 строк)
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: 'Полнотекстовый поиск по всему акту (русская морфология, websearch-синтаксис: "точная фраза", -исключить, or) и по части
          номеров акта, техники и запчастей'
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ActStatus'
        style: form
        explode: true
      - name: organizationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Организация
      - name: equipmentId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Техника
      - name: engineerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Инженер-участник
      - name: siteId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Площадка
      - name: partNumber
        in: query
        required: false
        schema:
          type: string
        description: Часть каталожного номера запчасти
      - name: shortDescription
        in: query
        required: false
        schema:
          type: string
        description: Краткое описание — точное совпадение
      - name: signedScan
        in: query
        required: false
        schema:
          type: boolean
        description: Есть ли скан подписанного акта
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Период работ с
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Период работ по
      - name: mine
        in: query
        required: false
        schema:
          type: boolean
        description: Только акты, где я участвую
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: number, createdAt, periodStart, organizationName, equipmentTitle, shortDescription, engineerNames, totalHours, status; «-»
          — по убыванию. По умолчанию — по релевантности при поиске, иначе -createdAt
      responses:
        '200':
          description: Файл .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /api/v1/acts/short-descriptions:
    get:
      operationId: listShortDescriptions
      tags:
      - acts
      summary: Ранее использованные краткие описания (автодополнение)
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Начало текста
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/v1/acts/{id}:
    get:
      operationId: getAct
      tags:
      - acts
      summary: Карточка акта
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateAct
      tags:
      - acts
      summary: Изменить шапку и описания
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActHeaderInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: deleteAct
      tags:
      - acts
      summary: Удалить незакрытый акт (черновик, открытый, аннулированный)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      responses:
        '204':
          description: Удалено
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/acts/{id}/open:
    post:
      operationId: openAct
      tags:
      - acts
      summary: 'Открыть: присвоить номер'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/acts/{id}/close:
    post:
      operationId: closeAct
      tags:
