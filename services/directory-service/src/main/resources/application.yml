spring:
  application:
    name: directory-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:directory}
    username: ${DB_USER:directory}
    password: ${DB_PASSWORD:directory}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Демо-данные подключаются добавлением classpath:db/demo (так сделано в docker-compose.yml).
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Издатель токена — адрес Keycloak, каким его видит браузер.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/acts}
          # Ключи забираются по внутреннему адресу (в Docker — http://keycloak:8080/...).
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/acts/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

app:
  version: "@project.version@"
  identity:
    keycloak:
      # Создание учётных записей инженеров. false — без Keycloak (тесты, запуск без него).
      enabled: ${KEYCLOAK_ADMIN_ENABLED:true}
      base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
      realm: ${KEYCLOAK_REALM:acts}
      client-id: ${KEYCLOAK_CLIENT_ID:acts-directory}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:acts-directory-secret}

info:
  app:
    name: directory-service
    version: "@project.version@"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
