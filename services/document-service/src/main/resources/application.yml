spring:
  application:
    name: document-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:documents}
    username: ${DB_USER:documents}
    password: ${DB_PASSWORD:documents}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Издатель токена — адрес Keycloak, каким его видит браузер.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/acts}
          # Ключи забираются по внутреннему адресу (в Docker — http://keycloak:8080/...).
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/acts/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

app:
  version: "@project.version@"
  zone: ${APP_ZONE:Europe/Moscow}
  # Реквизиты исполнителя (сервисной компании) для печатной формы; конструктор форм — раздел 16 SPEC.md
  company:
    name: ${COMPANY_NAME:ООО «Сервисная компания»}
    inn: ${COMPANY_INN:}
    kpp: ${COMPANY_KPP:}
    address: ${COMPANY_ADDRESS:}
    phone: ${COMPANY_PHONE:}
  clients:
    act-url: ${ACT_SERVICE_URL:http://localhost:8083}
    media-url: ${MEDIA_SERVICE_URL:http://localhost:8084}

info:
  app:
    name: document-service
    version: "@project.version@"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
