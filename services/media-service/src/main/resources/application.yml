spring:
  application:
    name: media-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:media}
    username: ${DB_USER:media}
    password: ${DB_PASSWORD:media}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Издатель токена — адрес Keycloak, каким его видит браузер.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/acts}
          # Ключи забираются по внутреннему адресу (в Docker — http://keycloak:8080/...).
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/acts/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

app:
  version: "@project.version@"
  storage:
    # s3 — S3-совместимое хранилище (RustFS в Docker Compose); memory — в памяти, для тестов
    type: ${STORAGE_TYPE:s3}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:acts}
    secret-key: ${S3_SECRET_KEY:acts-secret}
    bucket: ${S3_BUCKET:acts-media}

info:
  app:
    name: media-service
    version: "@project.version@"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
