spring:
  application:
    name: mail-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mail}
    username: ${DB_USER:mail}
    password: ${DB_PASSWORD:mail}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 30000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:acts}
    password: ${RABBITMQ_PASSWORD:acts}
  servlet:
    multipart:
      max-file-size: 5MB
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Издатель токена — адрес Keycloak, каким его видит браузер.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/acts}
          # Ключи забираются по внутреннему адресу (в Docker — http://keycloak:8080/...).
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/acts/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

app:
  version: "@project.version@"
  mail:
    # Общий ящик, от которого уходят письма; адрес пользователя ставится в Reply-To
    from: ${MAIL_FROM:acts@company.local}
    delivery-enabled: ${MAIL_DELIVERY_ENABLED:true}
    delivery-interval-ms: 10000
  outbox:
    publish-enabled: ${OUTBOX_PUBLISH_ENABLED:false}
  clients:
    act-url: ${ACT_SERVICE_URL:http://localhost:8083}
    document-url: ${DOCUMENT_SERVICE_URL:http://localhost:8085}

info:
  app:
    name: mail-service
    version: "@project.version@"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
