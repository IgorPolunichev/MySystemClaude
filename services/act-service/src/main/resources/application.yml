spring:
  application:
    name: act-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acts}
    username: ${DB_USER:acts}
    password: ${DB_PASSWORD:acts}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Издатель токена — адрес Keycloak, каким его видит браузер.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/acts}
          # Ключи забираются по внутреннему адресу (в Docker — http://keycloak:8080/...).
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/acts/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

app:
  version: "@project.version@"
  acts:
    # Префикс номера акта: АВР-2026-000123
    number-prefix: ${ACT_NUMBER_PREFIX:АВР}
    # Аннулированные акты удаляются фоновой задачей через столько дней (ежедневно в 03:30)
    purge-enabled: ${ACT_PURGE_ENABLED:true}
    purge-cancelled-after-days: ${ACT_PURGE_AFTER_DAYS:30}
  clients:
    directory-url: ${DIRECTORY_SERVICE_URL:http://localhost:8081}
    parts-url: ${PARTS_SERVICE_URL:http://localhost:8082}
    media-url: ${MEDIA_SERVICE_URL:http://localhost:8084}

info:
  app:
    name: act-service
    version: "@project.version@"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
