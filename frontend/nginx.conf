server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 27m;

    # API — на шлюз; браузер видит один адрес, CORS не нужен.
    # Адрес шлюза определяется заново каждые 10 с (встроенный DNS Docker): после перезапуска контейнера шлюза
    # его адрес в сети может смениться, а статический proxy_pass запомнил бы старый и отвечал 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Service worker и index.html не кэшируются, чтобы обновления приходили сразу.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: все остальные пути отдают index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
