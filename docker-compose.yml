# Локальный запуск всей системы: docker compose up --build
# Наблюдаемость (Prometheus, Grafana) — по профилю: docker compose --profile observability up --build
name: service-acts

x-java-env: &java-env
  DB_HOST: postgres
  DB_PORT: 5432
  OIDC_ISSUER_URI: http://localhost:8180/realms/acts
  OIDC_JWK_SET_URI: http://keycloak:8080/realms/acts/protocol/openid-connect/certs
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-acts}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-acts}

x-java-service: &java-service
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SERVICE_DATABASES: "directory parts acts media documents analytics mail keycloak"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13.7-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-acts}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-acts}
    # Сервисы подключаются к RabbitMQ внутри Docker-сети, порт 5672 наружу не нужен.
    # Веб-консоль — на 25672: стандартный 15672 часто занят другим RabbitMQ на компьютере.
    ports:
      - "25672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # S3-совместимое хранилище фото и файлов. MinIO удалил свои образы из Docker Hub (сентябрь 2026),
  # поэтому используется RustFS (Apache 2.0) — тот же S3 API, код сервисов не меняется (ADR 0006).
  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-acts}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-acts-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Адрес, который видит браузер; он же — издатель (iss) токенов.
      KC_HOSTNAME: http://localhost:8180
      # Сервисы ходят за ключами по внутреннему адресу keycloak:8080.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin}
    volumes:
      - ./infra/keycloak/acts-realm.json:/opt/keycloak/data/import/acts-realm.json:ro
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  api-gateway:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: api-gateway
    image: acts/api-gateway:dev
    environment:
      OIDC_ISSUER_URI: http://localhost:8180/realms/acts
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/acts/protocol/openid-connect/certs
      DIRECTORY_SERVICE_URL: http://directory-service:8081
      PARTS_SERVICE_URL: http://parts-service:8082
      ACT_SERVICE_URL: http://act-service:8083
      MEDIA_SERVICE_URL: http://media-service:8084
      DOCUMENT_SERVICE_URL: http://document-service:8085
      ANALYTICS_SERVICE_URL: http://analytics-service:8086
      MAIL_SERVICE_URL: http://mail-service:8087
    ports:
      - "8080:8080"
    depends_on:
      - directory-service
      - parts-service
      - act-service
      - media-service
      - document-service
      - analytics-service
      - mail-service

  directory-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: directory-service
    image: acts/directory-service:dev
    environment:
      <<: *java-env
      SERVER_PORT: 8081
      DB_NAME: directory
      DB_USER: directory
      DB_PASSWORD: directory
      # Демо-данные: организации, техника, инженеры для тестовых пользователей
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
      # Учётные записи инженеров создаются в Keycloak под служебным клиентом acts-directory
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_DIRECTORY_SECRET:-acts-directory-secret}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  parts-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: parts-service
    image: acts/parts-service:dev
    environment:
      <<: *java-env
      SERVER_PORT: 8082
      DB_NAME: parts
      DB_USER: parts
      DB_PASSWORD: parts
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  act-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: act-service
    image: acts/act-service:dev
    environment:
      <<: *java-env
      SERVER_PORT: 8083
      DB_NAME: acts
      DB_USER: acts
      DB_PASSWORD: acts
      # act-service берёт снимки техники и инженеров из справочников и добавляет позиции в каталог
      DIRECTORY_SERVICE_URL: http://directory-service:8081
      PARTS_SERVICE_URL: http://parts-service:8082
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  media-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: media-service
    image: acts/media-service:dev
    environment:
      <<: *java-env
      SERVER_PORT: 8084
      DB_NAME: media
      DB_USER: media
      DB_PASSWORD: media
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-acts}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-acts-secret}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_started

  document-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: document-service
    image: acts/document-service:dev
    environment:
      <<: *java-env
      SERVER_PORT: 8085
      DB_NAME: documents
      DB_USER: documents
      DB_PASSWORD: documents
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analytics-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: analytics-service
    image: acts/analytics-service:dev
    environment:
      <<: *java-env
      SERVER_PORT: 8086
      DB_NAME: analytics
      DB_USER: analytics
      DB_PASSWORD: analytics
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mail-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: mail-service
    image: acts/mail-service:dev
    environment:
      <<: *java-env
      SERVER_PORT: 8087
      DB_NAME: mail
      DB_USER: mail
      DB_PASSWORD: mail
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_OIDC_AUTHORITY: http://localhost:8180/realms/acts
        VITE_OIDC_CLIENT_ID: acts-frontend
    image: acts/frontend:dev
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"

volumes:
  postgres-data:
  rustfs-data:
